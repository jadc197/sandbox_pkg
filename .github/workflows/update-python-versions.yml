name: Update Supported Python Versions

on:
  schedule:
    - cron: '0 2 1 * *' # Runs at 02:00 UTC on the 1st of every month
  workflow_dispatch:      # Allows manual triggers anytime from GitHub UI

jobs:
    maintenance:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          pull-requests: write
          statuses: write

        steps:
          - name: Checkout code
            uses: actions/checkout@v7

          # No setup-python needed! We use the runner's native system python3,
          # which automatically evolves with future Python releases (3.x, 4.x, etc.).
          # pip install -r requirements.txt
          - name: Install dependencies using system Python
            run: |
              python3 -m pip install --upgrade pip
              pip install tomlkit

          - name: Run EOL script to update pyproject.toml
            run: python3 scripts/update_pyproject_python.py

          - name: Install dependencies using system Python
            run: pip install .[dev,test]

          - name: Run test suite
            run: pytest

          # SCENARIO A: Tests passed! Automatically create and merge the PR.
          - name: Create Pull Request
            id: cpr
            uses: peter-evans/create-pull-request@v7
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
              commit-message: "chore(deps): autonomous update of supported Python versions"
              branch: autonomous/version-update
              title: "Autonomous Maintenance: Update Python versions"
              body: "All automated tests passed successfully against the latest runner Python environment. Merging automatically."
              signoff: true

          - name: Enable Auto-Merge for the PR
            if: steps.cpr.outputs.pull-request-operation == 'created'
            run: |
              gh pr merge "${{ steps.cpr.outputs.pull-request-url }}" --auto --merge --delete-branch
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # SCENARIO B: Tests failed! Open an issue so you know something needs attention.
    notify-on-failure:
        needs: maintenance
        if: failure()
        runs-on: ubuntu-latest
        steps:
          - name: Create Issue on Test Failure
            uses: actions/github-script@v7
            with:
              script: |
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🚨 Autonomous Maintenance Failed: PyTest Error',
                  body: 'The monthly automated maintenance script ran, but **pytest failed** on the runner environment. The automated update was blocked to protect main. Please check the workflow logs to resolve the compatibility issue.'
                });