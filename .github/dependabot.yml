version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    groups:
      # Bundle ALL workflow actions updates into a single PR
      actions-and-workflows:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    groups:
      # Bundle ALL Python library updates into a single PR
      python-dependencies:
        patterns:
          - "*"