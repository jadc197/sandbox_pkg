[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox_pkg"  # Give it a unique prefix to prevent collisions on TestPyPI
version = "1.0.0"
description = "A mature sandbox package migrating from Gitea to GitHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable", # Signal that this package is complete
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
	"numpy >= 2.0.0",
] # Add upstream packages here if necessary

[project.optional-dependencies]
test = [
	"pytest",
	"pytest-cov",
	"ruff",
	"mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_pkg"]

[tool.pytest]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
branch = "main"
commit_parser = "conventional"
build_command = "pip install build && python -m build"